<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S – Stark Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=IBM+Plex+Mono:wght@400;500&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c542;--ash:#000507;--panel:#03141b;--line:#0c4a5c;--bone:#e6fdff;--dim:#6aa6b5;--g:#1fd6f0;--ok:#b8fbff;--err:#ff6b6b;--head:'Chakra Petch',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 42%,rgba(40,225,245,.34) 0,rgba(12,130,160,.22) 22%,rgba(3,40,54,.55) 45%,#000 78%) fixed,var(--ash);color:var(--bone);font:14px/1.55 var(--mono);overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px 20px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;background:rgba(1,14,20,.82);border:1px solid rgba(31,214,240,.45);backdrop-filter:blur(5px)}
.logo{margin:0}.logo b{display:block;font:700 clamp(1.5rem,5vw,2.4rem)/1 "Cinzel",Georgia,serif;letter-spacing:.14em;background:linear-gradient(180deg,#fff6bf 0%,#f7d25a 32%,#a96b10 52%,#f9d86a 72%,#8a5a0c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2c04) drop-shadow(0 0 10px rgba(245,197,66,.45))}.logo small{display:block;margin-top:6px;font:500 10px/1 var(--mono);letter-spacing:.34em;color:var(--gold)}
.st{display:flex;align-items:center;gap:8px;border:1px solid var(--g);padding:5px 12px;color:var(--g);font-size:12px;letter-spacing:.1em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);animation:p 1.8s infinite}@keyframes p{50%{opacity:.25}}
.st.busy .dot{background:#f2c14e;animation-duration:.5s}.st.busy{border-color:#f2c14e;color:#f2c14e}
#clock{color:var(--dim);font-size:12px}
.integ{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;margin:10px 0;background:rgba(1,14,20,.82);border:1px solid rgba(31,214,240,.3);backdrop-filter:blur(5px)}
.chip{border:1px solid var(--line);background:transparent;padding:4px 10px;font-size:12px;color:var(--dim);cursor:pointer}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:6px}
.chip.off{color:var(--err);border-color:var(--err)}.chip.off i{background:var(--err)}
.hint{color:var(--dim);font-size:12px;align-self:center}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;height:calc(100dvh - 170px);min-height:540px}
.panel{background:rgba(1,14,20,.74);backdrop-filter:blur(3px);border:1px solid rgba(31,214,240,.45);box-shadow:0 0 24px rgba(31,214,240,.18);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font:700 12px var(--head);letter-spacing:.14em;color:var(--gold)}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:8px 11px;border:1px solid var(--line);overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:#062833;border-color:#0f6a80}
.m.j{border-left:3px solid var(--g)}.m.e{border-left:3px solid var(--err);color:#ffc9c9}
.m b{color:var(--ok)}.m blockquote{margin:6px 0;padding:6px 10px;border-left:2px solid var(--line);color:var(--dim)}
.b{border:1px solid var(--g);background:var(--g);color:#00181f;padding:5px 12px;cursor:pointer;margin:6px 8px 0 0}
.b.alt{background:transparent;color:var(--g)}.b:hover{filter:brightness(1.15)}
.bar{height:6px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--g)}
#qbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 12px;border-top:1px solid var(--line);min-height:36px;font-size:12px}
.q{border:1px solid var(--line);padding:1px 8px;color:var(--dim);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q.running{border-color:#f2c14e;color:#f2c14e}.q.running::before{content:"▶ "}
#mode{margin-left:auto;font-size:11px;background:transparent;border:1px solid var(--line);color:var(--ok);padding:2px 8px;cursor:pointer}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
#chips button{border:1px solid var(--line);background:transparent;color:var(--dim);padding:3px 9px;font-size:12px;cursor:pointer}
#chips button:hover{border-color:var(--g);color:var(--bone)}
.inp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.inp input{flex:1;min-width:0;background:#010a0e;border:1px solid var(--line);padding:10px 12px}
.inp .b{margin:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;white-space:nowrap;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:9px 10px;cursor:pointer;font-size:12px}
.tab[aria-selected=true]{color:var(--g);border-color:var(--g)}
#view{flex:1;overflow:auto;padding:12px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:9px 10px;border:1px solid var(--line);margin-bottom:8px;align-items:center}
.row.new{animation:fl 1.6s}@keyframes fl{0%,40%{background:rgba(31,214,240,.28)}}
.row small{color:var(--dim);grid-column:2/4}
.tag{font-size:10px;letter-spacing:.12em;padding:1px 6px;border:1px solid var(--g);color:var(--g)}
.tag.r{border-color:#f2c14e;color:#f2c14e}.tag.bad{border-color:var(--err);color:var(--err)}
.path{color:var(--dim);margin:0 0 10px}.empty{color:var(--dim);padding:20px 0;text-align:center}
.fold{color:var(--ok);margin:12px 0 6px}
.lnk{background:transparent;border:1px solid var(--line);color:var(--g);padding:1px 8px;cursor:pointer;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--g);padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media(max-width:860px){.grid{grid-template-columns:1fr;height:auto}.panel{min-height:480px}#log{max-height:55vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hud{position:fixed;left:50%;top:46%;width:min(940px,135vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;opacity:.85}.hud svg{display:block;width:100%;height:100%}.holo{width:clamp(54px,10vw,74px);height:auto;flex:none;filter:drop-shadow(0 0 8px rgba(245,197,66,.45))}</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="holo" viewBox="0 0 100 100" aria-hidden="true"><defs><filter id="hg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="hc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6bf"/><stop offset="1" stop-color="#ffb21a"/></radialGradient></defs><g fill="none" stroke="#f5c542" filter="url(#hg)"><circle cx="50" cy="50" r="44" stroke-width="2.2" stroke-dasharray="1 2.6" opacity=".85"><animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="40s" repeatCount="indefinite"/></circle><g><ellipse cx="50" cy="50" rx="46" ry="17" stroke-width="1.6" transform="rotate(-22 50 50)"/><ellipse cx="50" cy="50" rx="41" ry="26" stroke-width="1" opacity=".8" transform="rotate(18 50 50)"/><animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="24s" repeatCount="indefinite"/></g><g stroke-width=".8" opacity=".8"><path d="M50 6V94M6 50H94M19 19L81 81M81 19L19 81" stroke-dasharray="6 3 2 3"/></g><circle cx="50" cy="50" r="13" stroke-width="1.4" opacity=".9"/><circle cx="50" cy="50" r="8" stroke-width="1.8"/></g><g fill="#ffd45a" filter="url(#hg)"><circle cx="22" cy="30" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="78" cy="24" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="30" cy="74" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="72" cy="70" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="50" cy="14" r="1.1"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="14" cy="52" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" begin="1.0s" repeatCount="indefinite"/></circle><circle cx="88" cy="50" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="40" cy="88" r="1.1"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" begin="1.4s" repeatCount="indefinite"/></circle><circle cx="62" cy="86" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="34" cy="40" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="66" cy="38" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" begin="2.0s" repeatCount="indefinite"/></circle><circle cx="58" cy="62" r="1.1"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" begin="2.2s" repeatCount="indefinite"/></circle><circle cx="44" cy="58" r="1"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="2.4s" repeatCount="indefinite"/></circle><circle cx="82" cy="72" r="0.9"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" begin="2.6s" repeatCount="indefinite"/></circle></g><circle cx="50" cy="50" r="3.4" fill="url(#hc)" filter="url(#hg)"><animate attributeName="r" values="3.4;4.4;3.4" dur="2.2s" repeatCount="indefinite"/></circle></svg><div class="logo"><b>J.A.R.V.I.S</b><small>STARK COMMAND CENTRE</small></div></div>
    <span id="clock"></span>
    <div class="st" id="st"><span class="dot"></span><span id="stt">JARVIS ONLINE</span></div>
  </header>
  <div class="integ" id="integ"></div>
  <main class="grid">
    <section class="panel" aria-label="JARVIS console">
      <div class="ph"><span>// CONSOLE</span><span id="cnt">0 ACTIONS</span></div>
      <div id="log" aria-live="polite"></div>
      <div id="qbar"><span style="color:var(--dim)">QUEUE:</span><span id="qs"></span><button id="mode" title="Choose what a new command does while JARVIS is busy"></button></div>
      <div id="chips"></div>

</div>
<input type="file" id="file" hidden>

<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var cap=function(s){return s.replace(/^./,function(c){return c.toUpperCase()})};
function at(o,h,m){var d=new Date();d.setDate(d.getDate()+o);d.setHours(h,m||0,0,0);return d}
function fmt(d){return d.toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function tm(d){return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
var S={events:[{id:1,title:'Lab diagnostics',start:at(1,10)}],rems:[{id:2,what:'Check the Mark 50',start:at(0,19)}],
 files:[{n:'reactor_design_report.pdf',f:'Research',d:at(-3,14)},{n:'arc_reactor_notes.docx',f:'Research',d:at(-9,11)},{n:'mark50_schematics.dwg',f:'Designs',d:at(-1,17)},{n:'stark_expo_budget.xlsx',f:'Finance',d:at(-14,9)},{n:'avengers_roster.pdf',f:'My Drive',d:at(-30,10)}],
 comms:[],integ:{cal:1,drive:1,tg:1},names:{cal:'Calendar',drive:'Drive',tg:'Telegram'}};
var queue=[],running=null,timer=null,pending=null,confirmCtx=null,uploadCtx=null,mode='queue',uid=3,lastEvent=null,tab='cal',newId=0,acts=0,hl='';
function msg(c,h){var d=document.createElement('div');d.className='m '+c;d.innerHTML=h;$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function stat(){var b=!!running;$('#st').classList.toggle('busy',b);$('#stt').textContent=b?'JARVIS PROCESSING':'JARVIS ONLINE'}
function renderQ(){var h='';queue.concat(running?[]:[]).forEach(function(t){h+='<span class="q">'+esc(t.text)+'</span>'});
 if(running)h='<span class="q running">'+esc(running.text)+'</span>'+h;$('#qs').innerHTML=h||'<span style="color:var(--dim)">empty</span>';
 $('#mode').textContent='NEW COMMAND: '+(mode==='queue'?'QUEUE IT':'INTERRUPT');$('#cnt').textContent=acts+' ACTIONS'}
function renderInteg(){var h='';Object.keys(S.integ).forEach(function(k){h+='<button class="chip'+(S.integ[k]?'':' off')+'" data-k="'+k+'"><i></i>'+S.names[k].toUpperCase()+(S.integ[k]?'':' OFFLINE')+'</button>'});
 $('#integ').innerHTML=h+'<span class="hint">Click a chip to simulate an outage or expired login.</span>'}
var TABS=[['cal','Calendar'],['rem','Reminders'],['drive','Drive'],['comms','Comms']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-t="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1].toUpperCase()+'</button>'}).join('')}
function view(){var h='',n=function(i){return i===newId?' new':''};
 if(tab==='cal'){var ev=S.events.slice().sort(function(a,b){return a.start-b.start});
  h=ev.length?ev.map(function(e){return '<div class="row'+n(e.id)+'"><span class="tag">EVENT</span><b>'+esc(e.title)+'</b><span>'+tm(e.start)+'</span><small>'+fmt(e.start)+(e.desc?' · '+esc(e.desc):'')+'</small></div>'}).join(''):'<div class="empty">No events scheduled.</div>'}
 if(tab==='rem'){var r=S.rems.slice().sort(function(a,b){return a.start-b.start});
  h=r.length?r.map(function(e){return '<div class="row'+n(e.id)+'"><span class="tag r">REMINDER</span><b>'+esc(e.what)+'</b><span>'+tm(e.start)+'</span><small>'+fmt(e.start)+'</small></div>'}).join(''):'<div class="empty">No active reminders.</div>'}
 if(tab==='drive'){var fs=S.files.filter(function(f){return !hl||hl.some(function(w){return f.n.toLowerCase().indexOf(w)>-1})});
  h='<p class="path">Drive / '+(hl?'search results':'My Drive')+'</p>';var gr={};fs.forEach(function(f){(gr[f.f]=gr[f.f]||[]).push(f)});
  Object.keys(gr).forEach(function(k){h+='<div class="fold">▸ '+esc(k)+'</div>'+gr[k].map(function(f){return '<div class="row'+(f.n===newId?' new':'')+'"><span class="tag">'+esc((f.n.split('.').pop()||'').toUpperCase())+'</span><b>'+esc(f.n)+'</b><button class="lnk" data-open="'+esc(f.n)+'">Open</button><small>'+esc(f.f)+' · modified '+fmt(f.d)+'</small></div>'}).join('')});
  if(!fs.length)h+='<div class="empty">No matching files.</div>';if(hl)h+='<button class="lnk" data-clear="1">Show all files</button>'}
 if(tab==='comms'){h=S.comms.length?S.comms.slice().reverse().map(function(c){return '<div class="row'+n(c.id)+'"><span class="tag'+(c.ok?'':' bad')+'">'+(c.ok?'DELIVERED':'CANCELLED')+'</span><b>To '+esc(c.to)+'</b><span>'+tm(c.t)+'</span><small>“'+esc(c.sum)+'” · sent by JARVIS via Telegram</small></div>'}).join(''):'<div class="empty">No messages sent yet.</div>'}
 $('#view').innerHTML=h}
function show(t){tab=t;renderTabs();view()}
function parseWhen(s){var d=/tomorrow/i.test(s)?1:0,m=s.match(/(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)/i);
 if(m){var h=+m[1]%12;if(/p/i.test(m[3]))h+=12;return at(d,h,+m[2]||0)}
 if(/morning/i.test(s))return at(d,9);if(/afternoon/i.test(s))return at(d,15);if(/evening|tonight/i.test(s))return at(d,19);return null}
function detect(s){if(/\bupload\b/i.test(s))return'up';if(/\b(find|search|locate)\b/i.test(s))return'find';
 if(/^(what|which|show|list|any)\b|\?$|\bdo i have\b/i.test(s))return'q';
 if(/\b(send|message|tell|text|ping)\b/i.test(s))return'tg';if(/remind/i.test(s))return'rem';if(/schedule|meeting|book|calendar/i.test(s))return'ev';return'?'}
function done(t,ok){t.state=ok===false?'failed':'done';running=null;if(ok!==false)acts++;stat();renderQ();setTimeout(next,350)}
function ask(q,k){pending={t:running,k:k};msg('j',q)}
function down(t,k){if(S.integ[k])return false;msg('e','⚠ '+S.names[k]+' is offline or its authorization expired. Click the <b>'+S.names[k].toUpperCase()+'</b> chip above to reconnect, then repeat the command.');done(t,false);return true}
var H={
 ev:function(t){if(down(t,'cal'))return;var w=parseWhen(t.text);if(!w)return ask('What time should I schedule this, sir?','w');
  var m=t.text.match(/[Mm]eeting with ([A-Z][a-z]+(?: [A-Z][a-z]+)?)/),tt;
  if(m)tt='Meeting with '+m[1];else if(m=t.text.match(/schedule (?:the |a |an )?(.+?)(?: for| on| at| tomorrow| today|$)/i))tt=cap(m[1]);else tt='Meeting';
  var ds=t.text.match(/(?:about|regarding|to discuss) (.+)$/i),e={id:++uid,title:tt,start:w,desc:ds?ds[1]:''};S.events.push(e);lastEvent=e;newId=e.id;
  msg('j','Done. <b>'+esc(tt)+'</b> is on your calendar for '+fmt(w)+'.');show('cal');done(t)},
 rem:function(t){var w,rel=t.text.match(/(\d+)\s*minutes?\s*before/i),what;
  if(rel&&lastEvent){w=new Date(lastEvent.start-rel[1]*6e4);what='Upcoming: '+lastEvent.title}
  else{w=parseWhen(t.text);what=t.text.replace(/^remind me/i,'').replace(/\b(at \d{1,2}(:\d{2})?\s*[ap]\.?m\.?|tomorrow( morning| evening| afternoon)?|today|tonight)\b/gi,'').replace(/\s+/g,' ').trim().replace(/^(to|about)\s+/i,'');
   if(!w)return ask('When should I remind you, sir?','w');if(!what)return ask('What should I remind you about?','what')}
  var r={id:++uid,what:cap(what),start:w};S.rems.push(r);newId=r.id;msg('j','Reminder set: <b>'+esc(r.what)+'</b> at '+fmt(w)+'.');show('rem');done(t)},
 q:function(t){if(/remind/i.test(t.text)){var x=S.rems.filter(function(r){return r.start.toDateString()===new Date().toDateString()});

  else{var d=/tomorrow/i.test(t.text)?1:/today/i.test(t.text)?0:-1,x=S.events.filter(function(e){return d<0||e.start.toDateString()===at(d,0).toDateString()});
